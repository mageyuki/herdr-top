[package]
name = "herdr-top"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[features]
workload-harness = []

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tokio-util = "0.7"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
ulid = "1"
sha2 = "0.10"
libc = "0.2"
notify = "8"
unicode-segmentation = "=1.13.3"

[dev-dependencies]
tempfile = "3"
